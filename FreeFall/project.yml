name: FreeFall
options:
  bundleIdPrefix: com.dhruva
  deploymentTarget:
    iOS: "17.0"
targets:
  FreeFall:
    type: application
    platform: iOS
    sources:
      - FreeFall
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          PROVISIONING_PROFILE_SPECIFIER: ""
    entitlements:
      path: FreeFall/FreeFall.entitlements
      properties:
        com.apple.developer.weatherkit: true
    info:
      path: FreeFall/Info.plist
      properties:
        CFBundleDisplayName: "Free Fall"
        NSRemindersUsageDescription: "FreeFall creates reminders for you."
        NSRemindersFullAccessUsageDescription: "FreeFall creates reminders for you."
        NSCalendarsUsageDescription: "FreeFall adds events to your calendar."
        NSCalendarsFullAccessUsageDescription: "FreeFall adds events to your calendar."
        NSLocationWhenInUseUsageDescription: "FreeFall uses your location to find nearby restaurants, calculate travel times, and check weather."
        NSContactsUsageDescription: "Free Fall accesses your contacts to send Apple Cash payments on your behalf."
        NSFaceIDUsageDescription: "Free Fall uses Face ID to authorize Apple Cash payments."
        NSSiriUsageDescription: "Free Fall uses Siri to initiate Apple Cash transfers."
        LSApplicationQueriesSchemes:
          - doordash
          - googlechrome
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
